{{- if and .Values.auth.enabled .Values.auth.createSecret.enabled (not .Values.auth.existingSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-schema-registry-mcp.oauth2SecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-schema-registry-mcp.labels" . | nindent 4 }}
  {{- include "kafka-schema-registry-mcp.annotations" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.auth.createSecret.clientId | quote }}
  client-secret: {{ .Values.auth.createSecret.clientSecret | quote }}
---
{{- end }}

{{- if not .Values.requestStateKey.existingSecret }}
{{- $requestStateSecret := printf "%s-request-state" (include "kafka-schema-registry-mcp.fullname" .) }}
{{- $existingRequestState := lookup "v1" "Secret" .Release.Namespace $requestStateSecret }}
{{- if and (not .Values.requestStateKey.value) (not $existingRequestState) .Values.requestStateKey.disallowGenerated }}
{{- fail "requestStateKey.disallowGenerated is true but neither requestStateKey.value nor requestStateKey.existingSecret is set; GitOps renders cannot read an existing Secret with lookup" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $requestStateSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-schema-registry-mcp.labels" . | nindent 4 }}
  {{- include "kafka-schema-registry-mcp.annotations" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.requestStateKey.secretKey }}: {{ if .Values.requestStateKey.value }}{{ .Values.requestStateKey.value | b64enc }}{{ else if $existingRequestState }}{{ index $existingRequestState.data .Values.requestStateKey.secretKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
---
{{- end }}

{{- if and (or .Values.schemaRegistry.user .Values.schemaRegistry.password) (not .Values.schemaRegistry.existingSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-schema-registry-mcp.schemaRegistrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-schema-registry-mcp.labels" . | nindent 4 }}
  {{- include "kafka-schema-registry-mcp.annotations" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.schemaRegistry.user }}
  username: {{ .Values.schemaRegistry.user | quote }}
  {{- end }}
  {{- if .Values.schemaRegistry.password }}
  password: {{ .Values.schemaRegistry.password | quote }}
  {{- end }}
{{- end }} 