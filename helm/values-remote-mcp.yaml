# Helm values for Remote MCP Server Deployment
# This configuration deploys the Kafka Schema Registry MCP Server 
# as a remote MCP server compatible with Anthropic's MCP ecosystem

# Global settings
global:
  deployment:
    mode: "remote-mcp"  # Remote MCP server mode
  environment: "production"  # Environment label for metrics
    
# Application configuration (port must match service.targetPort; ConfigMap sets MCP_PORT)
app:
  name: "kafka-schema-registry-remote-mcp"
  version: "3.2.0"
  viewonly: false
  logLevel: "INFO"
  port: 8000

image:
  repository: "aywengo/kafka-schema-reg-mcp"
  tag: "stable"
  pullPolicy: IfNotPresent

# HTTP remote MCP server
command:
  - python
  - remote-mcp-server.py

# Remote MCP Server Configuration
remoteMcp:
  # Transport configuration
  transport: "streamable-http"  # Options: streamable-http, sse
  host: "0.0.0.0"
  port: 8000
  path: "/mcp"  # Will be /sse for SSE transport
  
  # TLS/HTTPS configuration
  tls:
    enabled: true
    certManager: true
    issuer: "letsencrypt-prod"  # ClusterIssuer name
    
  # OAuth Authentication (required for remote deployment)
  oauth:
    enabled: true
    provider: "azure"  # Options: azure, google, keycloak, okta, auto
    
    # Azure AD Configuration
    azure:
      tenantId: "${AZURE_TENANT_ID}"
      clientId: "${AZURE_CLIENT_ID}"
      clientSecret: "${AZURE_CLIENT_SECRET}"
      
    # Custom OAuth configuration
    issuerUrl: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
    audience: "${AZURE_CLIENT_ID}"
    
    # Scope-based authorization
    validScopes: ["read", "write", "admin"]
    defaultScopes: ["read"]
    requiredScopes: ["read"]

# Schema Registry connection (example - replace with your registries)
schemaRegistry:
  url: "https://prod-schema-registry.your-domain.com"
  user: "${PROD_REGISTRY_USER}"
  password: "${PROD_REGISTRY_PASSWORD}"
  multiRegistry:
    enabled: true
    registries:
      - name: "production"
        url: "https://prod-schema-registry.your-domain.com"
        viewonly: true
        user: "${PROD_REGISTRY_USER}"
        password: "${PROD_REGISTRY_PASSWORD}"
      - name: "staging"
        url: "https://staging-schema-registry.your-domain.com"
        viewonly: false
        user: "${STAGING_REGISTRY_USER}"
        password: "${STAGING_REGISTRY_PASSWORD}"

# OAuth2 Authentication Configuration
auth:
  enabled: true
  oauth2:
    issuerUrl: "${AUTH_ISSUER_URL}"
    validScopes: "read,write,admin"
    defaultScopes: "read"
    requiredScopes: "read"
    clientRegistrationEnabled: false
    revocationEnabled: true
  existingSecret:
    enabled: false
    name: ""
    clientIdKey: "client-id"
    clientSecretKey: "client-secret"
  createSecret:
    enabled: true
    clientId: "${AZURE_CLIENT_ID}"
    clientSecret: "${AZURE_CLIENT_SECRET}"

extraEnvVars:
  - name: MCP_TRANSPORT
    value: "streamable-http"
  - name: MCP_HOST
    value: "0.0.0.0"
  - name: MCP_PATH
    value: "/mcp"
  - name: TLS_ENABLED
    value: "true"
  - name: AUTH_AUDIENCE
    value: "${AUTH_AUDIENCE}"
  - name: JWKS_CACHE_TTL
    value: "3600"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"

# Ingress configuration for remote access
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  hosts:
    - host: mcp-schema-registry.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-schema-registry-tls
      hosts:
        - mcp-schema-registry.your-domain.com

# Tool catalog edition: viewer, editor, or admin.
edition: admin

replicaCount: 2

# Liveness uses /ready so a Schema Registry outage does not restart the pod
livenessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

# Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Security context (uid 999 matches the image's mcp user)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  readOnlyRootFilesystem: true

# Network policies
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    from:
      - namespaceSelector: {}
  egress:
    enabled: true
    to: []

# Secrets for OAuth credentials
secrets:
  oauth:
    enabled: true
    annotations:
      reloader.stakater.com/match: "true"
    data:
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
      PROD_REGISTRY_PASSWORD: "${PROD_REGISTRY_PASSWORD}"
      STAGING_REGISTRY_PASSWORD: "${STAGING_REGISTRY_PASSWORD}"

# ConfigMaps
configMaps:
  app:
    enabled: true
    data:
      mcp-config.yaml: |
        server:
          name: "Kafka Schema Registry Remote MCP Server"
          description: "Remote MCP server for Kafka Schema Registry operations with OAuth authentication"
          version: "3.2.0"
          
        endpoints:
          mcp: "https://mcp-schema-registry.your-domain.com/mcp"
          health: "https://mcp-schema-registry.your-domain.com/health"
          
        oauth:
          provider: "azure"
          issuer: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
          
        features:
          - "Editions: 40 viewer / 43 editor / 68 admin tools"
          - "Multi-Registry Support"
          - "OAuth Authentication"
          - "Real-time Operations"
          - "Schema Migration"
          - "Context Management"

# Monitoring
monitoring:
  enabled: true
  
  # ServiceMonitor configuration (for Service-based monitoring)
  serviceMonitor:
    enabled: false  # Disabled in favor of PodMonitor
    interval: 30s
    path: /metrics
    labels:
      release: prometheus
    scrapeTimeout: 10s
    
  # PodMonitor configuration (preferred for direct pod monitoring)
  podMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    scrapeTimeout: 10s
    honorLabels: false
    
    # Additional labels for the PodMonitor resource
    labels:
      release: prometheus
      component: mcp-server
      
    # Labels to copy from pods to metrics
    podTargetLabels:
      - instanceId
      - deployment
      - environment
      - app.kubernetes.io/version
      
    # Relabeling rules to enhance metrics
    relabelings:
      # Add cluster label
      - sourceLabels: []
        targetLabel: cluster
        replacement: "{{ .Values.global.cluster | default \"default\" }}"
      
      # Add service label
      - sourceLabels: []
        targetLabel: service
        replacement: "kafka-schema-registry-mcp"
        
      # Preserve instance label as instanceId
      - sourceLabels: [__meta_kubernetes_pod_label_instanceId]
        targetLabel: instanceId
        
      # Add deployment info
      - sourceLabels: [__meta_kubernetes_pod_label_deployment]
        targetLabel: deployment
        
      # Add environment info
      - sourceLabels: [__meta_kubernetes_pod_label_environment]
        targetLabel: environment
    
    # Metric relabeling (optional - for metric transformation)
    metricRelabelings: []
    
    # Limits
    sampleLimit: 10000
    targetLimit: 100
    
# Logging
logging:
  level: "INFO"
  format: "json"
  
# Documentation annotations
annotations:
  "mcp.anthropic.com/server": "true"
  "mcp.anthropic.com/transport": "streamable-http"
  "mcp.anthropic.com/oauth": "true"
  "mcp.anthropic.com/tools": "48"
  "description": "Remote MCP server for Kafka Schema Registry with OAuth authentication" 
