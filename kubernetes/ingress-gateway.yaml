# Gateway routing example for two MCP editions.
#
# Deploy the same chart twice, once per edition:
#   helm upgrade --install mcp-viewer helm -f helm/values.yaml --set edition=viewer
#   helm upgrade --install mcp-admin  helm -f helm/values.yaml --set edition=admin
#
# Replace the service names below with the services created by those releases.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-schema-registry-mcp-gateway
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # The MCP 2026-07-28 routing headers are Mcp-Method and Mcp-Name.
    # nginx lowercases and maps them to $http_mcp_method / $http_mcp_name.
    nginx.ingress.kubernetes.io/server-snippet: |
      set $mcp_backend "mcp-viewer-kafka-schema-registry-mcp";
      if ($http_mcp_method = "tools/call") {
        if ($http_mcp_name ~ "^(delete_subject|delete_context|update_global_config|update_subject_config|set_default_registry|create_context|migrate_context)$") {
          set $mcp_backend "mcp-admin-kafka-schema-registry-mcp";
        }
      }
      proxy_pass http://$mcp_backend;
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-viewer-kafka-schema-registry-mcp
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: mcp-viewer-kafka-schema-registry-mcp
                port:
                  number: 8000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: mcp-viewer-kafka-schema-registry-mcp
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: mcp-viewer-kafka-schema-registry-mcp
                port:
                  number: 8000
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: mcp-viewer-kafka-schema-registry-mcp
                port:
                  number: 8000
  tls:
    - hosts:
        - mcp.example.com
      secretName: mcp-tls
