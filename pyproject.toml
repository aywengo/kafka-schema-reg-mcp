[project]
name = "kafka-schema-registry-mcp"
dynamic = ["version"]
description = "A Model Context Protocol (MCP) server for Kafka Schema Registry - enables AI assistants to interact with Kafka schemas through a standardized interface"
authors = [
    {name = "Kafka Schema Registry MCP Team", email = ""},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.1,<25.0.0",
    "httpx>=0.27.0",
    "fastmcp[tasks]>=4.1,<5",  # FastMCP 4 / MCP 2026-07-28 (v3.0, #187)
    "fastmcp-tasks>=4.1,<5",  # SEP-2663 tasks extension, registered at startup
    "pydocket>=0.26.0",  # required by fastmcp-tasks
    "mcp>=2.2,<3",  # MCP SDK 2.x; FastMCP 4 needs >=2.2 for client/server extras
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.13.5",
    "jsonschema>=4.26.0",
    "PyJWT>=2.10.1",
    "joserfc>=1.7,<2",
    "cryptography>=45.0.7",
    "avro-python3>=1.10.2",
    "jaraco-context>=6.1.2",  # GHSA-58pv-8j8x-9vj2 (transitive via fastmcp/keyring)
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 (transitive via pydocket/redis stack)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.1",
    "ruff>=0.15.10",
    "mypy>=1.5.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/aywengo/kafka-schema-reg-mcp"
Repository = "https://github.com/aywengo/kafka-schema-reg-mcp"
Issues = "https://github.com/aywengo/kafka-schema-reg-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "_version.py"

[tool.hatch.build]
include = [
    "*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true 